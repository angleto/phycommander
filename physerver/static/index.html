<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhyCMD - Physical Commander</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .status-bar {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.connected {
            background: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e0e0e0;
        }

        .panel h2 {
            font-size: 18px;
            color: #555;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .gpio-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .gpio-button {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-weight: bold;
        }

        .gpio-button:hover {
            background: #f0f0f0;
        }

        .gpio-button.active {
            background: #4CAF50;
            color: white;
            border-color: #45a049;
        }

        .gpio-button.input {
            cursor: default;
            background: #e3f2fd;
        }

        .gpio-button.input.active {
            background: #2196F3;
            color: white;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .value-display {
            min-width: 60px;
            text-align: right;
            font-family: monospace;
            font-weight: bold;
        }

        .adc-display {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .adc-channel {
            background: white;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .adc-channel .label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .adc-channel .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            font-family: monospace;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 14px;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PhyCMD - Physical Commander</h1>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="uptimeValue">0s</div>
                    <div class="stat-label">Uptime</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="loopTimeValue">0µs</div>
                    <div class="stat-label">Loop Time</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="errorCountValue">0</div>
                    <div class="stat-label">Errors</div>
                </div>
            </div>
        </div>

        <div class="grid">
            <!-- Digital Outputs -->
            <div class="panel">
                <h2>Digital Outputs</h2>
                <div class="gpio-grid" id="gpioOutputs"></div>
            </div>

            <!-- Digital Inputs -->
            <div class="panel">
                <h2>Digital Inputs</h2>
                <div class="gpio-grid" id="gpioInputs"></div>
            </div>

            <!-- DAC Control -->
            <div class="panel">
                <h2>DAC Outputs</h2>
                <div class="control-group">
                    <label>DAC 0 (0-4095)</label>
                    <div class="slider-container">
                        <input type="range" min="0" max="4095" value="0" id="dac0Slider">
                        <span class="value-display" id="dac0Value">0</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>DAC 1 (0-4095)</label>
                    <div class="slider-container">
                        <input type="range" min="0" max="4095" value="0" id="dac1Slider">
                        <span class="value-display" id="dac1Value">0</span>
                    </div>
                </div>
            </div>

            <!-- ADC Readings -->
            <div class="panel">
                <h2>ADC Inputs</h2>
                <div class="adc-display" id="adcDisplay"></div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket connection
        let ws = null;
        let currentCommand = {
            digital_out: 0,
            dac: [0, 0],
            pwm: [0, 0],
            flags: {
                adc_enable: true,
                dac_enable: true,
                pwm_enable: false,
                reset_seq: false,
                watchdog_disable: false
            },
            seq_num: 0
        };

        // Initialize GPIO outputs
        const gpioOutputsContainer = document.getElementById('gpioOutputs');
        for (let i = 0; i < 16; i++) {
            const btn = document.createElement('button');
            btn.className = 'gpio-button';
            btn.textContent = `GP${i}`;
            btn.dataset.pin = i;
            btn.onclick = () => toggleGpioOutput(i);
            gpioOutputsContainer.appendChild(btn);
        }

        // Initialize GPIO inputs
        const gpioInputsContainer = document.getElementById('gpioInputs');
        for (let i = 0; i < 16; i++) {
            const btn = document.createElement('div');
            btn.className = 'gpio-button input';
            btn.textContent = `GP${i}`;
            btn.dataset.pin = i;
            gpioInputsContainer.appendChild(btn);
        }

        // Initialize ADC display
        const adcDisplayContainer = document.getElementById('adcDisplay');
        for (let i = 0; i < 8; i++) {
            const channel = document.createElement('div');
            channel.className = 'adc-channel';
            channel.innerHTML = `
                <div class="label">ADC ${i}</div>
                <div class="value" id="adc${i}Value">0</div>
            `;
            adcDisplayContainer.appendChild(channel);
        }

        // DAC sliders
        const dac0Slider = document.getElementById('dac0Slider');
        const dac1Slider = document.getElementById('dac1Slider');
        const dac0Value = document.getElementById('dac0Value');
        const dac1Value = document.getElementById('dac1Value');

        dac0Slider.oninput = () => {
            const value = parseInt(dac0Slider.value);
            dac0Value.textContent = value;
            currentCommand.dac[0] = value;
            sendCommand();
        };

        dac1Slider.oninput = () => {
            const value = parseInt(dac1Slider.value);
            dac1Value.textContent = value;
            currentCommand.dac[1] = value;
            sendCommand();
        };

        function toggleGpioOutput(pin) {
            const mask = 1 << pin;
            currentCommand.digital_out ^= mask;
            updateGpioOutputButtons();
            sendCommand();
        }

        function updateGpioOutputButtons() {
            const buttons = gpioOutputsContainer.querySelectorAll('.gpio-button');
            buttons.forEach((btn, i) => {
                const isActive = (currentCommand.digital_out & (1 << i)) !== 0;
                btn.classList.toggle('active', isActive);
            });
        }

        function updateGpioInputButtons(digitalIn) {
            const buttons = gpioInputsContainer.querySelectorAll('.gpio-button');
            buttons.forEach((btn, i) => {
                const isActive = (digitalIn & (1 << i)) !== 0;
                btn.classList.toggle('active', isActive);
            });
        }

        function sendCommand() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(currentCommand));
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Connected';
            };

            ws.onmessage = (event) => {
                const status = JSON.parse(event.data);
                updateStatus(status);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Disconnected';

                // Reconnect after 2 seconds
                setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function updateStatus(status) {
            // Update GPIO inputs
            updateGpioInputButtons(status.digital_in);

            // Update ADC values
            for (let i = 0; i < 8; i++) {
                document.getElementById(`adc${i}Value`).textContent = status.adc[i];
            }

            // Update stats
            document.getElementById('uptimeValue').textContent = formatUptime(status.uptime_ms);
            document.getElementById('loopTimeValue').textContent = status.loop_time_us + 'µs';
            document.getElementById('errorCountValue').textContent = status.error_count;
        }

        function formatUptime(ms) {
            const seconds = Math.floor(ms / 1000);
            if (seconds < 60) return seconds + 's';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + 'm';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h';
            const days = Math.floor(hours / 24);
            return days + 'd';
        }

        // Connect on page load
        connectWebSocket();
        updateGpioOutputButtons();
    </script>
</body>
</html>
