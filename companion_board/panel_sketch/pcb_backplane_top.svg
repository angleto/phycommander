    </g>
    <g id="J5">
      <rect x="77.5" y="23" width="25" height="10" rx="0.5" ry="0.5" class="conn-body-dsub15"/>
      <g class="pad" transform="translate(79.27, 25.73)">
        <circle cx="0"     cy="0" r="0.4"/><circle cx="0"     cy="2.54" r="0.4"/>
        <circle cx="2.54"  cy="0" r="0.4"/><circle cx="2.54"  cy="2.54" r="0.4"/>
        <circle cx="5.08"  cy="0" r="0.4"/><circle cx="5.08"  cy="2.54" r="0.4"/>
        <circle cx="7.62"  cy="0" r="0.4"/><circle cx="7.62"  cy="2.54" r="0.4"/>
        <circle cx="10.16" cy="0" r="0.4"/><circle cx="10.16" cy="2.54" r="0.4"/>
        <circle cx="12.7"  cy="0" r="0.4"/><circle cx="12.7"  cy="2.54" r="0.4"/>
        <circle cx="15.24" cy="0" r="0.4"/><circle cx="15.24" cy="2.54" r="0.4"/>
        <circle cx="17.78" cy="0" r="0.4"/><circle cx="17.78" cy="2.54" r="0.4"/>
      </g>
      <text x="90" y="29" class="label-ref">J5</text>
      <text x="90" y="31" class="label-pers">DB15-3 Bank High</text>
      <text x="90" y="36" class="label-coord">DIN/DOUT 8-11 + ADC8-11 + AREF</text>
    </g>
  </g>

  <!-- Row C: 5 DB9 IDC + 1 JTAG bridge (2x5 shrouded, body 17 x 10) -->
  <g id="row-C-DB9-and-bridge">
    <g id="J6">
      <rect x="6" y="37" width="17" height="10" rx="0.5" ry="0.5" class="conn-body-dsub9"/>
      <g class="pad" transform="translate(8.77, 39.73)">
        <circle cx="0"     cy="0" r="0.4"/><circle cx="0"     cy="2.54" r="0.4"/>
        <circle cx="2.54"  cy="0" r="0.4"/><circle cx="2.54"  cy="2.54" r="0.4"/>
        <circle cx="5.08"  cy="0" r="0.4"/><circle cx="5.08"  cy="2.54" r="0.4"/>
        <circle cx="7.62"  cy="0" r="0.4"/><circle cx="7.62"  cy="2.54" r="0.4"/>
        <circle cx="10.16" cy="0" r="0.4"/><circle cx="10.16" cy="2.54" r="0.4"/>
      </g>
      <text x="14.5" y="43" class="label-ref">J6</text>
      <text x="14.5" y="45" class="label-pers">DB9-1 Quick Analog</text>
    </g>
    <g id="J7">
      <rect x="25" y="37" width="17" height="10" rx="0.5" ry="0.5" class="conn-body-dsub9"/>
      <g class="pad" transform="translate(27.77, 39.73)">
        <circle cx="0"     cy="0" r="0.4"/><circle cx="0"     cy="2.54" r="0.4"/>
        <circle cx="2.54"  cy="0" r="0.4"/><circle cx="2.54"  cy="2.54" r="0.4"/>
        <circle cx="5.08"  cy="0" r="0.4"/><circle cx="5.08"  cy="2.54" r="0.4"/>
        <circle cx="7.62"  cy="0" r="0.4"/><circle cx="7.62"  cy="2.54" r="0.4"/>
