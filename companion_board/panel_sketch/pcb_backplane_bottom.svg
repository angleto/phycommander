<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="120mm" height="100mm"
     viewBox="0 0 120 100"
     version="1.1">

  <title>PCB Backplane v4 — Bottom Layer (Arduino mating side, X-ray view, 1:1)</title>
  <desc>
    1:1 scale placement guide for the phycommander I/O backplane v4
    (120 x 100 mm, 4-layer Arduino Due shield), bottom side. Carries
    8 male pin headers (~7 mm pin, non-stackable) facing DOWN that
    mate with the Arduino Due's female sockets. Drawn in X-RAY view
    (same coordinate system as the top SVG, looking through the PCB
    from the top). Mirror horizontally if printing for any process
    that exposes from the bottom-pad side. Coordinates in mm with
    origin at the south-west corner of the backplane; SVG Y-axis is
    flipped relative to the design doc (doc Y up, SVG Y down).
    The two starred (*) headers H_UART and H_AEXT are placed at
    standard Mega R3 / Due R3 extension positions but **must be
    verified against an actual Arduino Due** before fabrication
    (see PCB_BACKPLANE_PINOUT.md §1.4).
  </desc>

  <defs>
    <style type="text/css"><![CDATA[
      .pcb-bg     { fill: #2a5a3a; }
      .silk       { fill: none; stroke: #f5f5f5; stroke-width: 0.15; }
      .ghost      { fill: none; stroke: #ffffff; stroke-width: 0.25; stroke-dasharray: 1.5,0.7; opacity: 0.45; }
      .cutout     { fill: #fafafa; stroke: #1a1a1a; stroke-width: 0.20; }
      .hole       { fill: #1a1a1a; stroke: #d0d0d0; stroke-width: 0.10; }
      .pad        { fill: #c8a14a; stroke: none; }
      .header     { fill: #1f1f1f; stroke: #f5f5f5; stroke-width: 0.18; }
      .header-warn{ fill: #6a2a2a; stroke: #f5f5f5; stroke-width: 0.18; }
      .label-ref  { font: bold 1.6px sans-serif; fill: #ffffff; text-anchor: middle; }
      .label-pers { font: 1.3px sans-serif; fill: #ffffff; text-anchor: middle; }
      .label-coord{ font: 1.2px sans-serif; fill: #ffffff; opacity: 0.65; text-anchor: middle; }
      .label-area { font: italic 1.4px sans-serif; fill: #ffffff; text-anchor: middle; opacity: 0.7; }
      .label-title{ font: bold 2.4px sans-serif; fill: #ffffff; text-anchor: start; }
      .label-sub  { font: 1.4px sans-serif; fill: #ffffff; text-anchor: start; opacity: 0.85; }
      .label-warn { font: bold 1.2px sans-serif; fill: #ffaaaa; text-anchor: middle; }
    ]]></style>
  </defs>

  <!-- PCB substrate -->
  <rect x="0" y="0" width="120" height="100" rx="0.8" ry="0.8" class="pcb-bg"/>

  <!-- Title block -->
  <g transform="translate(2, 3)">
    <text class="label-title">phycommander backplane v4</text>
    <text x="0" y="2.8" class="label-sub">120 x 100 mm  ·  4-layer  ·  Arduino Due shield  ·  BOTTOM layer (X-ray)</text>
  </g>

  <!-- Arduino Due footprint ghost outline -->
  <g id="due-ghost">
    <rect x="0" y="46.66" width="101.6" height="53.34" class="ghost"/>
    <text x="50.8" y="74" class="label-area">Arduino Due R3 — female sockets up here</text>
    <text x="50.8" y="77" class="label-area">(this layer's pins poke DOWN into them)</text>
  </g>

  <!-- Mounting holes (same 8 as top) -->
  <g id="mounting-holes">
    <circle cx="15.24" cy="49.20" r="1.6" class="hole"/>
    <circle cx="90.17" cy="49.20" r="1.6" class="hole"/>
    <circle cx="66.04" cy="82.22" r="1.6" class="hole"/>
    <circle cx="15.24" cy="97.46" r="1.6" class="hole"/>
    <circle cx="4"     cy="96"    r="1.6" class="hole"/>
    <circle cx="116"   cy="96"    r="1.6" class="hole"/>
    <circle cx="4"     cy="4"     r="1.6" class="hole"/>
    <circle cx="116"   cy="4"     r="1.6" class="hole"/>
  </g>

  <!-- JTAG cutout (passes through) -->
  <g id="jtag-cutout">
    <rect x="9" y="70.5" width="14" height="7" rx="1" ry="1" class="cutout"/>
    <text x="16" y="74" class="label-coord" style="fill:#1a1a1a; opacity:0.85">JTAG cutout (Due-J1 below)</text>
  </g>

  <!-- ============================================================ -->
  <!-- Arduino Due mating headers (8 total) -->
  <!-- All male pin headers facing DOWN, ~7mm pin length, non-stackable -->
  <!-- Position in doc coords (origin SW), SVG Y = 100 - doc Y -->
  <!-- ============================================================ -->

  <!-- H_PWR (POWER 1x8) at south-west of Due -->
  <!-- Doc center (14, 1.5) -> SVG (14, 98.5); span ~17.78 wide x ~2.54 tall -->
  <g id="H_PWR">
    <rect x="5.11" y="97.23" width="17.78" height="2.54" class="header"/>
    <g class="pad">
      <circle cx="6.38"  cy="98.5" r="0.5"/>
      <circle cx="8.92"  cy="98.5" r="0.5"/>
      <circle cx="11.46" cy="98.5" r="0.5"/>
      <circle cx="14.00" cy="98.5" r="0.5"/>
      <circle cx="16.54" cy="98.5" r="0.5"/>
      <circle cx="19.08" cy="98.5" r="0.5"/>
      <circle cx="21.62" cy="98.5" r="0.5"/>
      <circle cx="24.16" cy="98.5" r="0.5"/>
    </g>
    <text x="14" y="95" class="label-ref">H_PWR</text>
    <text x="14" y="93" class="label-coord">1x8: VIN/GND/GND/5V/3V3/RST/IOREF/NC</text>
  </g>

  <!-- H_ANA (ANALOG 1x8) at south, east of POWER -->
  <!-- Doc center (42, 1.5) -> SVG (42, 98.5) -->
  <g id="H_ANA">
    <rect x="33.11" y="97.23" width="17.78" height="2.54" class="header"/>
    <g class="pad">
      <circle cx="34.38" cy="98.5" r="0.5"/>
      <circle cx="36.92" cy="98.5" r="0.5"/>
      <circle cx="39.46" cy="98.5" r="0.5"/>
      <circle cx="42.00" cy="98.5" r="0.5"/>
      <circle cx="44.54" cy="98.5" r="0.5"/>
      <circle cx="47.08" cy="98.5" r="0.5"/>
      <circle cx="49.62" cy="98.5" r="0.5"/>
      <circle cx="52.16" cy="98.5" r="0.5"/>
    </g>
    <text x="42" y="95" class="label-ref">H_ANA</text>
    <text x="42" y="93" class="label-coord">1x8: A0..A7 (ADC0..7)</text>
  </g>

  <!-- H_AEXT (analog extension 1x6) at south-east of Due  *** VERIFY *** -->
  <!-- Doc center (62, 1.5) -> SVG (62, 98.5) -->
  <g id="H_AEXT">
    <rect x="55.65" y="97.23" width="12.7" height="2.54" class="header-warn"/>
    <g class="pad">
      <circle cx="56.92" cy="98.5" r="0.5"/>
      <circle cx="59.46" cy="98.5" r="0.5"/>
      <circle cx="62.00" cy="98.5" r="0.5"/>
      <circle cx="64.54" cy="98.5" r="0.5"/>
      <circle cx="67.08" cy="98.5" r="0.5"/>
      <circle cx="69.62" cy="98.5" r="0.5"/>
    </g>
    <text x="62" y="95" class="label-ref">H_AEXT *</text>
    <text x="62" y="93" class="label-coord">1x6: A8..A11 + D70/D71</text>
    <text x="62" y="91" class="label-warn">verify on real Due</text>
  </g>

  <!-- H_COM (COMM 1x10) at north, west side -->
  <!-- Doc center (20, 51) -> SVG (20, 49) -->
  <g id="H_COM">
    <rect x="8.57" y="47.73" width="22.86" height="2.54" class="header"/>
    <g class="pad">
      <circle cx="9.84"  cy="49" r="0.5"/>
      <circle cx="12.38" cy="49" r="0.5"/>
      <circle cx="14.92" cy="49" r="0.5"/>
      <circle cx="17.46" cy="49" r="0.5"/>
      <circle cx="20.00" cy="49" r="0.5"/>
      <circle cx="22.54" cy="49" r="0.5"/>
      <circle cx="25.08" cy="49" r="0.5"/>
      <circle cx="27.62" cy="49" r="0.5"/>
      <circle cx="30.16" cy="49" r="0.5"/>
      <circle cx="32.70" cy="49" r="0.5"/>
    </g>
    <text x="20" y="52.5" class="label-ref">H_COM</text>
    <text x="20" y="54.5" class="label-coord">1x10: D8..D13/GND/AREF/SDA/SCL</text>
  </g>

  <!-- H_UART (UART/I2C extension 1x8) at north-center, between COMM and DIGITAL  *** VERIFY *** -->
  <!-- Doc center (50, 51) -> SVG (50, 49) -->
  <g id="H_UART">
    <rect x="41.11" y="47.73" width="17.78" height="2.54" class="header-warn"/>
    <g class="pad">
      <circle cx="42.38" cy="49" r="0.5"/>
      <circle cx="44.92" cy="49" r="0.5"/>
      <circle cx="47.46" cy="49" r="0.5"/>
      <circle cx="50.00" cy="49" r="0.5"/>
      <circle cx="52.54" cy="49" r="0.5"/>
      <circle cx="55.08" cy="49" r="0.5"/>
      <circle cx="57.62" cy="49" r="0.5"/>
      <circle cx="60.16" cy="49" r="0.5"/>
    </g>
    <text x="50" y="52.5" class="label-ref">H_UART *</text>
    <text x="50" y="54.5" class="label-coord">1x8: D14..D21 (TX3/RX3/.../SDA/SCL)</text>
    <text x="50" y="56.5" class="label-warn">verify on real Due</text>
  </g>

  <!-- H_DIG (DIGITAL 1x8) at north, east side -->
  <!-- Doc center (75, 51) -> SVG (75, 49) -->
  <g id="H_DIG">
    <rect x="66.11" y="47.73" width="17.78" height="2.54" class="header"/>
    <g class="pad">
      <circle cx="67.38" cy="49" r="0.5"/>
      <circle cx="69.92" cy="49" r="0.5"/>
      <circle cx="72.46" cy="49" r="0.5"/>
      <circle cx="75.00" cy="49" r="0.5"/>
      <circle cx="77.54" cy="49" r="0.5"/>
      <circle cx="80.08" cy="49" r="0.5"/>
      <circle cx="82.62" cy="49" r="0.5"/>
      <circle cx="85.16" cy="49" r="0.5"/>
    </g>
    <text x="75" y="52.5" class="label-ref">H_DIG</text>
    <text x="75" y="54.5" class="label-coord">1x8: D0(RX)..D7</text>
  </g>

  <!-- H_D22 (2x18 dual block) on east edge of Due -->
  <!-- Doc center (97, 25) -> SVG (97, 75); body 5.08 wide x 43.18 tall vertical -->
  <g id="H_D22">
    <rect x="94.46" y="53.41" width="5.08" height="43.18" class="header"/>
    <!-- Pin grid: 18 rows x 2 cols, 2.54mm pitch -->
    <g class="pad">
      <g transform="translate(95.73, 54.68)">
        <!-- 18 rows of 2 pins -->
        <circle cx="0"     cy="0" r="0.5"/><circle cx="2.54" cy="0" r="0.5"/>
        <circle cx="0"     cy="2.54" r="0.5"/><circle cx="2.54" cy="2.54" r="0.5"/>
        <circle cx="0"     cy="5.08" r="0.5"/><circle cx="2.54" cy="5.08" r="0.5"/>
        <circle cx="0"     cy="7.62" r="0.5"/><circle cx="2.54" cy="7.62" r="0.5"/>
        <circle cx="0"     cy="10.16" r="0.5"/><circle cx="2.54" cy="10.16" r="0.5"/>
        <circle cx="0"     cy="12.7" r="0.5"/><circle cx="2.54" cy="12.7" r="0.5"/>
        <circle cx="0"     cy="15.24" r="0.5"/><circle cx="2.54" cy="15.24" r="0.5"/>
        <circle cx="0"     cy="17.78" r="0.5"/><circle cx="2.54" cy="17.78" r="0.5"/>
        <circle cx="0"     cy="20.32" r="0.5"/><circle cx="2.54" cy="20.32" r="0.5"/>
        <circle cx="0"     cy="22.86" r="0.5"/><circle cx="2.54" cy="22.86" r="0.5"/>
        <circle cx="0"     cy="25.4" r="0.5"/><circle cx="2.54" cy="25.4" r="0.5"/>
        <circle cx="0"     cy="27.94" r="0.5"/><circle cx="2.54" cy="27.94" r="0.5"/>
        <circle cx="0"     cy="30.48" r="0.5"/><circle cx="2.54" cy="30.48" r="0.5"/>
        <circle cx="0"     cy="33.02" r="0.5"/><circle cx="2.54" cy="33.02" r="0.5"/>
        <circle cx="0"     cy="35.56" r="0.5"/><circle cx="2.54" cy="35.56" r="0.5"/>
        <circle cx="0"     cy="38.1" r="0.5"/><circle cx="2.54" cy="38.1" r="0.5"/>
        <circle cx="0"     cy="40.64" r="0.5"/><circle cx="2.54" cy="40.64" r="0.5"/>
        <!-- 18th row not drawn to leave room for label -->
      </g>
    </g>
    <text x="89" y="75" class="label-ref" style="text-anchor:end">H_D22</text>
    <text x="89" y="77" class="label-coord" style="text-anchor:end">2x18: D22..D53 (DIN/DOUT)</text>
  </g>

  <!-- H_DAC (DAC/CAN 1x6) on east edge above H_D22 -->
  <!-- Doc center (97, 50) -> SVG (97, 50); body 5.08 wide x 12.7 tall vertical -->
  <g id="H_DAC">
    <rect x="94.46" y="43.65" width="5.08" height="12.7" class="header"/>
    <g class="pad">
      <g transform="translate(95.73, 44.92)">
        <!-- Could be 1x6 vertical or 2x3; here drawn as 1x6 column on inner pin -->
        <circle cx="0" cy="0" r="0.5"/>
        <circle cx="0" cy="2.54" r="0.5"/>
        <circle cx="0" cy="5.08" r="0.5"/>
        <circle cx="0" cy="7.62" r="0.5"/>
        <circle cx="0" cy="10.16" r="0.5"/>
        <circle cx="0" cy="12.7" r="0.5"/>
      </g>
    </g>
    <text x="89" y="48" class="label-ref" style="text-anchor:end">H_DAC</text>
    <text x="89" y="50" class="label-coord" style="text-anchor:end">1x6: DAC0/1, CANRX/TX, GND</text>
  </g>

  <!-- ============================================================ -->
  <!-- East margin annotation: bottom-side area below the CAN xceiver -->
  <!-- (component bodies are on TOP layer; bottom layer just shows pad arrays) -->
  <!-- ============================================================ -->
  <g id="east-margin">
    <rect x="102.5" y="49" width="15" height="44" rx="0.6" ry="0.6" class="silk"/>
    <text x="110" y="51.5" class="label-area">CAN xceiver</text>
    <text x="110" y="68" class="label-coord">(component pads,</text>
    <text x="110" y="70.5" class="label-coord">no bottom-side</text>
    <text x="110" y="73" class="label-coord">parts on this</text>
    <text x="110" y="75.5" class="label-coord">layer)</text>
  </g>

  <!-- Footer -->
  <g id="legend" transform="translate(2, 96)">
    <text x="0" y="0" class="label-coord" style="text-anchor:start; opacity:0.6">X-ray view: same coords as top SVG. Two starred (*) headers = standard Mega R3 / Due R3 positions, VERIFY on real Due. Mirror Y if printing for bottom-pad-side exposure.</text>
  </g>

</svg>
