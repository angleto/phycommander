[package]
name = "phycmd-py"
version = "2.1.2"
edition = "2021"
authors = ["Angelo Leto <angelo@leto.blue>"]
description = "pyo3 bindings for the PhyCommander Rust RT stack"
license = "AGPL-3.0-or-later"

[lib]
# The pyo3 cdylib is named `phycmd_ext` to avoid colliding with the
# sibling `phycmd-rust` crate's lib name (also `phycmd`). The Python
# package re-exports the symbols so consumers still write
# `import phycmd` — see `python/phycmd/__init__.py`.
name = "phycmd_ext"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
phycmd-rust = { path = "../phycmd-rust", features = ["test-mock"] }
phycmd-core = { path = "../phycmd-core", features = ["test-mock"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
parking_lot = "0.12"
anyhow = "1.0"
tokio = { version = "1.35", features = ["sync", "rt"], default-features = false }
# libusb-1.0 raw bindings used by the WaveformDev class to talk to the
# on-chip function generator via EP0 control transfers. Same version
# pinned in phycmd-core to keep the workspace on a single libusb.
libusb1-sys = "0.7"
libc = "0.2"
