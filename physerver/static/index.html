<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhyCMD - Physical Commander</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
        }
        .container {
            max-width: 1400px; margin: 0 auto; background: white;
            border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 24px;
        }
        h1 { color: #333; margin-bottom: 6px; font-size: 22px; }
        h1 small { font-size: 13px; color: #999; font-weight: normal; }

        /* ---- Status bar ---- */
        .status-bar {
            background: #f5f5f5; padding: 10px 16px; border-radius: 6px;
            margin-bottom: 16px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .status-left { display: flex; align-items: center; gap: 14px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
        .status-dot.connected { background: #4CAF50; box-shadow: 0 0 8px #4CAF50; }
        .status-text { font-size: 13px; color: #555; }
        .status-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 12px; font-size: 12px;
            font-weight: 600; font-family: monospace; white-space: nowrap;
        }
        .badge.temp { background: #e8f5e9; color: #2e7d32; }
        .badge.temp.warn { background: #fff3e0; color: #e65100; }
        .badge.temp.crit { background: #ffebee; color: #c62828; }
        .badge.info { background: #e3f2fd; color: #1565c0; }
        .badge.err  { background: #ffebee; color: #c62828; }

        .status-stats { display: flex; gap: 16px; flex-wrap: wrap; }
        .stat-mini { text-align: center; }
        .stat-mini .v { font-size: 15px; font-weight: bold; color: #667eea; font-family: monospace; }
        .stat-mini .l { font-size: 10px; color: #999; text-transform: uppercase; }

        /* ---- Grid ---- */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px; margin-bottom: 16px;
        }
        .panel {
            background: #f9f9f9; border-radius: 8px; padding: 16px; border: 1px solid #e0e0e0;
        }
        .panel h2 {
            font-size: 14px; color: #555; margin-bottom: 12px; text-transform: uppercase;
            letter-spacing: 0.5px; border-bottom: 2px solid #667eea; padding-bottom: 8px;
        }
        .panel.wide { grid-column: 1 / -1; }

        /* ---- GPIO ---- */
        .gpio-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
        .gpio-button {
            padding: 8px 2px; border: 2px solid #ddd; border-radius: 4px;
            background: white; cursor: pointer; transition: all 0.15s;
            text-align: center; font-weight: bold; font-size: 11px;
        }
        .gpio-button:hover { background: #f0f0f0; }
        .gpio-button.active { background: #4CAF50; color: white; border-color: #45a049; }
        .gpio-button.input { cursor: default; background: #f5f5f5; }
        .gpio-button.input.active { background: #2196F3; color: white; }

        /* ---- DAC ---- */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; margin-bottom: 4px; font-weight: 600; color: #555; font-size: 13px; }
        .slider-container { display: flex; align-items: center; gap: 8px; }
        input[type="range"] { flex: 1; height: 6px; border-radius: 3px; background: #ddd; outline: none; }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #667eea; cursor: pointer;
        }
        .value-display { min-width: 50px; text-align: right; font-family: monospace; font-weight: bold; font-size: 14px; }

        /* ---- ADC ---- */
        .adc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .adc-ch {
            background: white; padding: 8px 10px; border-radius: 4px; border-left: 3px solid #667eea;
            position: relative; overflow: hidden;
        }
        .adc-ch .bar {
            position: absolute; left: 0; bottom: 0; height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.2s;
        }
        .adc-ch .lbl { font-size: 10px; color: #999; }
        .adc-ch .val { font-size: 18px; font-weight: bold; color: #333; font-family: monospace; }

        /* ---- Sysinfo ---- */
        .sysinfo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
        .sysinfo-section { }
        .sysinfo-section h3 {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
            color: #888; margin-bottom: 4px; font-weight: 600;
        }
        .sysinfo-row {
            display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
            padding: 3px 0; border-bottom: 1px dotted #e8e8e8;
            font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 12px;
        }
        .sysinfo-row:last-child { border-bottom: none; }
        .sysinfo-row .label { color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sysinfo-row .value { color: #333; font-weight: bold; white-space: nowrap; }
        .sysinfo-unavailable { color: #999; font-style: italic; font-size: 13px; text-align: center; padding: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>PhyCMD <small>Physical Commander</small></h1>

    <!-- ============ STATUS BAR ============ -->
    <div class="status-bar">
        <div class="status-left">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Disconnected</span>
            <div class="status-badges" id="tempBadges"></div>
        </div>
        <div class="status-stats">
            <div class="stat-mini"><div class="v" id="rateValue">-</div><div class="l">Hz</div></div>
            <div class="stat-mini"><div class="v" id="uptimeValue">-</div><div class="l">Uptime</div></div>
            <div class="stat-mini"><div class="v" id="loopTimeValue">-</div><div class="l">Loop</div></div>
            <div class="stat-mini"><div class="v" id="errorCountValue">0</div><div class="l">Errors</div></div>
            <div class="stat-mini"><div class="v" id="seqValue">-</div><div class="l">Seq</div></div>
        </div>
    </div>

    <div class="grid">
        <!-- ============ SYSTEM TELEMETRY (first, always visible) ============ -->
        <div class="panel wide" id="sysinfoPanel">
            <h2>System Telemetry</h2>
            <div id="sysinfoDisplay"><div class="sysinfo-unavailable">Loading...</div></div>
        </div>

        <!-- ============ DIGITAL OUTPUTS ============ -->
        <div class="panel">
            <h2>Digital Outputs</h2>
            <div class="gpio-grid" id="gpioOutputs"></div>
        </div>

        <!-- ============ DIGITAL INPUTS ============ -->
        <div class="panel">
            <h2>Digital Inputs</h2>
            <div class="gpio-grid" id="gpioInputs"></div>
        </div>

        <!-- ============ DAC CONTROL ============ -->
        <div class="panel">
            <h2>DAC Outputs</h2>
            <div class="control-group">
                <label>DAC 0</label>
                <div class="slider-container">
                    <input type="range" min="0" max="4095" value="0" id="dac0Slider">
                    <span class="value-display" id="dac0Value">0</span>
                </div>
            </div>
            <div class="control-group">
                <label>DAC 1</label>
                <div class="slider-container">
                    <input type="range" min="0" max="4095" value="0" id="dac1Slider">
                    <span class="value-display" id="dac1Value">0</span>
                </div>
            </div>
        </div>

        <!-- ============ ADC READINGS ============ -->
        <div class="panel">
            <h2>ADC Inputs</h2>
            <div class="adc-grid" id="adcDisplay"></div>
        </div>
    </div>
</div>

<script>
// ====================================================================
//   State
// ====================================================================
let ws = null;
let msgCount = 0;
let lastRateTs = performance.now();
let lastRateCount = 0;

let currentCommand = {
    digital_out: 0, dac: [0, 0], pwm: [0, 0],
    flags: { adc_enable: true, dac_enable: true, pwm_enable: false, reset_seq: false, watchdog_disable: false },
    seq_num: 0
};

// ====================================================================
//   Init DOM
// ====================================================================
const gpioOut = document.getElementById('gpioOutputs');
const gpioIn  = document.getElementById('gpioInputs');
const adcDisp = document.getElementById('adcDisplay');

for (let i = 0; i < 16; i++) {
    const b = document.createElement('button');
    b.className = 'gpio-button'; b.textContent = i; b.dataset.pin = i;
    b.onclick = () => toggleGpio(i);
    gpioOut.appendChild(b);
}
for (let i = 0; i < 16; i++) {
    const d = document.createElement('div');
    d.className = 'gpio-button input'; d.textContent = i; d.dataset.pin = i;
    gpioIn.appendChild(d);
}
for (let i = 0; i < 8; i++) {
    const ch = document.createElement('div');
    ch.className = 'adc-ch';
    ch.innerHTML = `<div class="lbl">CH${i}</div><div class="val" id="adc${i}V">0</div><div class="bar" id="adc${i}Bar"></div>`;
    adcDisp.appendChild(ch);
}

// DAC sliders
const dac0S = document.getElementById('dac0Slider'), dac0V = document.getElementById('dac0Value');
const dac1S = document.getElementById('dac1Slider'), dac1V = document.getElementById('dac1Value');
dac0S.oninput = () => { dac0V.textContent = dac0S.value; currentCommand.dac[0] = +dac0S.value; sendCmd(); };
dac1S.oninput = () => { dac1V.textContent = dac1S.value; currentCommand.dac[1] = +dac1S.value; sendCmd(); };

// ====================================================================
//   GPIO toggle + update
// ====================================================================
function toggleGpio(pin) {
    currentCommand.digital_out ^= (1 << pin);
    updateGpioOut(); sendCmd();
}
function updateGpioOut() {
    gpioOut.querySelectorAll('.gpio-button').forEach((b, i) => {
        b.classList.toggle('active', (currentCommand.digital_out & (1 << i)) !== 0);
    });
}
function updateGpioIn(val) {
    gpioIn.querySelectorAll('.gpio-button').forEach((b, i) => {
        b.classList.toggle('active', (val & (1 << i)) !== 0);
    });
}

// ====================================================================
//   WebSocket
// ====================================================================
function sendCmd() { if (ws && ws.readyState === 1) ws.send(JSON.stringify(currentCommand)); }

function connectWs() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => {
        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').textContent = 'Connected';
    };
    ws.onmessage = (e) => { msgCount++; updateStatus(JSON.parse(e.data)); };
    ws.onclose = () => {
        document.getElementById('statusDot').classList.remove('connected');
        document.getElementById('statusText').textContent = 'Reconnecting...';
        setTimeout(connectWs, 2000);
    };
}

function updateStatus(s) {
    updateGpioIn(s.digital_in);
    for (let i = 0; i < 8; i++) {
        document.getElementById(`adc${i}V`).textContent = s.adc[i];
        document.getElementById(`adc${i}Bar`).style.width = (s.adc[i] / 4095 * 100).toFixed(1) + '%';
    }
    document.getElementById('uptimeValue').textContent = fmtUptime(s.uptime_ms);
    document.getElementById('loopTimeValue').textContent = s.loop_time_us + 'us';
    document.getElementById('errorCountValue').textContent = s.error_count;
    document.getElementById('seqValue').textContent = s.seq_num;
    if (s.error_count > 0) document.getElementById('errorCountValue').parentElement.querySelector('.v').style.color = '#c62828';
}

// Update rate measurement every 2s
setInterval(() => {
    const now = performance.now();
    const dt = (now - lastRateTs) / 1000;
    const hz = dt > 0 ? ((msgCount - lastRateCount) / dt).toFixed(0) : '-';
    document.getElementById('rateValue').textContent = hz;
    lastRateTs = now; lastRateCount = msgCount;
}, 2000);

function fmtUptime(ms) {
    const s = Math.floor(ms/1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s/60);
    if (m < 60) return m + 'm ' + (s%60) + 's';
    const h = Math.floor(m/60);
    if (h < 24) return h + 'h ' + (m%60) + 'm';
    return Math.floor(h/24) + 'd ' + (h%24) + 'h';
}

// ====================================================================
//   System Telemetry
// ====================================================================
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function fmtSensor(s) {
    const v = Number(s.value);
    if (s.unit === '\u00b0C') return v.toFixed(1) + ' \u00b0C';
    if (s.unit === 'V')  return v.toFixed(3) + ' V';
    if (s.unit === 'RPM') return v.toFixed(0) + ' RPM';
    return v.toFixed(2) + ' ' + esc(s.unit);
}

function tempClass(v) { return v >= 80 ? 'crit' : v >= 60 ? 'warn' : ''; }

function renderSysinfo(data) {
    // Temperature badges in status bar
    const badges = document.getElementById('tempBadges');
    if (data && data.available && data.hwmon) {
        let bhtml = '';
        for (const chip of data.hwmon) {
            for (const t of (chip.temperatures || [])) {
                const v = Number(t.value);
                const cls = tempClass(v);
                const lbl = chip.name === 'coretemp' ? 'CPU' : chip.name === 'drivetemp' ? 'Disk' : esc(chip.name);
                bhtml += `<span class="badge temp ${cls}">${lbl} ${v.toFixed(0)}\u00b0C</span>`;
            }
        }
        if (data.load_avg) {
            bhtml += `<span class="badge info">Load ${data.load_avg.one.toFixed(2)}</span>`;
        }
        if (data.memory) {
            const pct = ((data.memory.total_kb - data.memory.available_kb) / data.memory.total_kb * 100).toFixed(0);
            bhtml += `<span class="badge info">RAM ${pct}%</span>`;
        }
        badges.innerHTML = bhtml;
    }

    // Detailed panel
    const el = document.getElementById('sysinfoDisplay');
    if (!data || !data.available) {
        el.innerHTML = '<div class="sysinfo-unavailable">Hardware sensors not available</div>';
        return;
    }
    let html = '<div class="sysinfo-grid">';

    // Sensors
    const hasHw = data.hwmon && data.hwmon.some(c =>
        (c.temperatures||[]).length || (c.voltages||[]).length || (c.fans||[]).length ||
        (c.currents||[]).length || (c.powers||[]).length);
    if (hasHw) {
        html += '<div class="sysinfo-section"><h3>Hardware Sensors</h3>';
        for (const chip of data.hwmon) {
            for (const s of [].concat(chip.temperatures||[], chip.voltages||[], chip.fans||[], chip.currents||[], chip.powers||[])) {
                html += `<div class="sysinfo-row"><span class="label">${esc(chip.name)} \u00b7 ${esc(s.label)}</span><span class="value">${fmtSensor(s)}</span></div>`;
            }
        }
        html += '</div>';
    }

    // CPUs
    if (data.cpus && data.cpus.length) {
        html += '<div class="sysinfo-section"><h3>CPU Cores</h3>';
        for (const c of data.cpus) {
            html += `<div class="sysinfo-row"><span class="label">cpu${c.cpu} (${esc(c.governor)})</span><span class="value">${Number(c.freq_mhz).toFixed(0)} MHz</span></div>`;
        }
        html += '</div>';
    }

    // System + Memory
    html += '<div class="sysinfo-section"><h3>System</h3>';
    if (data.load_avg) {
        const la = data.load_avg;
        html += `<div class="sysinfo-row"><span class="label">Load (1/5/15m)</span><span class="value">${la.one.toFixed(2)} / ${la.five.toFixed(2)} / ${la.fifteen.toFixed(2)}</span></div>`;
    }
    if (data.uptime_seconds != null) {
        const s = Math.floor(data.uptime_seconds);
        const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
        const parts = []; if(d) parts.push(d+'d'); if(h||d) parts.push(h+'h'); parts.push(m+'m');
        html += `<div class="sysinfo-row"><span class="label">System uptime</span><span class="value">${parts.join(' ')}</span></div>`;
    }
    if (data.memory) {
        const m = data.memory;
        const totMiB = (m.total_kb/1024).toFixed(0);
        const usedMiB = ((m.total_kb - m.available_kb)/1024).toFixed(0);
        const pct = (m.total_kb > 0 ? (m.total_kb - m.available_kb)/m.total_kb*100 : 0).toFixed(1);
        html += `<div class="sysinfo-row"><span class="label">RAM</span><span class="value">${usedMiB} / ${totMiB} MiB (${pct}%)</span></div>`;
        if (m.swap_total_kb > 0) {
            const swUsed = ((m.swap_total_kb - m.swap_free_kb)/1024).toFixed(0);
            const swTot = (m.swap_total_kb/1024).toFixed(0);
            html += `<div class="sysinfo-row"><span class="label">Swap</span><span class="value">${swUsed} / ${swTot} MiB</span></div>`;
        }
    }
    html += '</div>';
    html += '</div>'; // close sysinfo-grid
    el.innerHTML = html;
}

async function pollSysinfo() {
    try {
        const r = await fetch('/api/sysinfo');
        if (r.ok) renderSysinfo(await r.json());
    } catch(e) {}
}

// ====================================================================
//   Boot
// ====================================================================
connectWs();
updateGpioOut();
pollSysinfo();
setInterval(pollSysinfo, 5000);
</script>
</body>
</html>
