[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "phycmd"
version = "2.1.1"
description = "Hard-real-time Python bindings for the PhyCommander control stack"
authors = [{ name = "Angelo Leto", email = "angelo@leto.blue" }]
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.8"
keywords = ["real-time", "control", "usb", "phycommander", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/angleto/phycommander"
Repository = "https://github.com/angleto/phycommander"

[tool.maturin]
# The Rust cdylib is named `phycmd_ext` (see Cargo.toml); the
# top-level Python package is `phycmd` (see `python/phycmd/__init__.py`)
# and imports the compiled symbols from `phycmd.phycmd_ext`.
module-name = "phycmd.phycmd_ext"
python-source = "python"
features = ["pyo3/extension-module"]
