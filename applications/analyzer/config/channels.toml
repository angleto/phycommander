# phycommander multi-function analyzer — channel and transport config.
#
# Edit this file to match your specific hardware build. The default
# values below correspond to the beer QC configuration described in
# docs/applications/BEER_ANALYZER.md §5 and
# docs/applications/analyzer/build/HARDWARE_SCHEMATICS.md §8.
#
# Modulation frequencies are chosen to be pairwise incommensurate and
# to satisfy the constraints in
# docs/applications/MULTIFUNCTION_ANALYZER.md Appendix A. If you change
# them, run `pytest tests/test_freq_set.py` to verify the new set.

# Sample rate of phycommander in USB bulk mode (Hz)
fs_hz = 10000.0

# Lock-in integration window (seconds). 1 s → ENBW ~1 Hz.
integration_s = 1.0

# -------------------------------------------------------------------
# Channels — 8 wavelengths, one per light source
# -------------------------------------------------------------------

[[channels]]
name         = "340nm"
wavelength_nm = 340
freq_hz      = 1013.0
gate_kind    = "pwm"
gate_index   = 0        # PWM0 (Arduino Due pin D6)
adc_index    = 0
enabled      = true
safety_gated = false
notes        = "UV LED, NADH detection for enzymatic assays (ethanol, glucose)"

[[channels]]
name         = "430nm"
wavelength_nm = 430
freq_hz      = 1709.0
gate_kind    = "pwm"
gate_index   = 1        # PWM1 (Arduino Due pin D7)
adc_index    = 0
enabled      = true
safety_gated = false
notes        = "Violet LED, beer color EBC standard (A430 × 25)"

[[channels]]
name         = "470nm"
wavelength_nm = 470
freq_hz      = 571.0
gate_kind    = "dout_toggle"
gate_index   = 0        # DOUT0
adc_index    = 0
enabled      = true
safety_gated = false
notes        = "Blue LED, carotenoids, general blue chromophores"

[[channels]]
name         = "525nm"
wavelength_nm = 525
freq_hz      = 881.0
gate_kind    = "dout_toggle"
gate_index   = 1        # DOUT1
adc_index    = 0
enabled      = true
safety_gated = false
notes        = "Green LED, iron/phenanthroline, DNS reducing sugars"

[[channels]]
name         = "590nm"
wavelength_nm = 590
freq_hz      = 1223.0
gate_kind    = "dout_toggle"
gate_index   = 2        # DOUT2
adc_index    = 0
enabled      = true
safety_gated = false
notes        = "Amber LED, Bradford protein (595 nm peak, 590 close)"

[[channels]]
name         = "650nm_laser"
wavelength_nm = 650
freq_hz      = 1439.0
gate_kind    = "dout_toggle"
gate_index   = 3        # DOUT3 (INTERLOCK-GATED in firmware)
adc_index    = 0        # also used as ADC1 for nephelometry via secondary TIA
enabled      = true
safety_gated = true     # Class 3R laser — firmware interlock required
notes        = "650 nm laser, EBC haze (90° scatter), methylene blue, chlorophyll a"

[[channels]]
name         = "740nm"
wavelength_nm = 740
freq_hz      = 1931.0
gate_kind    = "dac_compare"
gate_index   = 0        # DAC0 → comparator → MOSFET gate
adc_index    = 0
enabled      = true
safety_gated = false
notes        = "Deep red LED, Folin-Ciocalteu polyphenols (765 nm peak)"

[[channels]]
name         = "940nm"
wavelength_nm = 940
freq_hz      = 2311.0
gate_kind    = "dac_compare"
gate_index   = 1        # DAC1 → comparator → MOSFET gate
adc_index    = 0
enabled      = true
safety_gated = false
notes        = "NIR LED, haze reference (no common chromophores at 940 nm)"

# -------------------------------------------------------------------
# physerver connection
# -------------------------------------------------------------------

[physerver]
transport = "ipc"
ipc_path  = "/dev/shm/phycmd_status"
ws_url    = "ws://localhost:8080/ws"
timeout_s = 5.0

# -------------------------------------------------------------------
# File paths
# -------------------------------------------------------------------

[paths]
database = "~/.phycommander/analyzer.db"
reports  = "~/.phycommander/analyzer/reports"
