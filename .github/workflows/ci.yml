name: CI

on:
  push:
    branches: [ main, master, develop, "v1.*" ]
  pull_request:
    branches: [ main, master, develop, "v1.*" ]

env:
  CARGO_TERM_COLOR: always
  # Warnings are surfaced but don't block the build — this repo
  # intentionally keeps some dead_code (transport abstractions) and
  # unused_imports (re-exports) that would flap on -D warnings across
  # Rust toolchain versions. Real errors still fail.
  RUSTFLAGS: "-A dead_code -A unused_imports -A unused_variables"

jobs:

  # ----------------------------------------------------------------------
  # Host: Rust server + core crates. This is the primary gate.
  # ----------------------------------------------------------------------
  physerver:
    name: physerver (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physerver
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            physerver/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('physerver/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        # Clippy runs as an advisory gate: reports lints in the run log
        # without failing the job. Elevate back to blocking once the
        # existing backlog (13 errors across phycmd-core, mostly
        # derivable_impls / should_implement_trait) is worked through.
        run: cargo clippy --workspace --all-targets --all-features -- -W clippy::all
        continue-on-error: true

      - name: Build
        run: cargo build --workspace --all-features --verbose

      - name: Test
        run: cargo test --workspace --all-features --verbose

      - name: Build release
        run: cargo build --release --bin physerver --verbose

  # ----------------------------------------------------------------------
  # Security audit runs on a schedule-like cadence; don't fail the job on
  # known advisories that upstream hasn't fixed yet — surface them as a
  # warning instead. Flip `continue-on-error` off once the queue is clean.
  # ----------------------------------------------------------------------
  security-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    needs: physerver
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo-audit
        working-directory: physerver
        run: cargo audit
        continue-on-error: true

  # ----------------------------------------------------------------------
  # Firmware build on the ARM GNU Toolchain. Also builds the host-side
  # phycmd-core release once more so the wire-format _Static_assert in
  # waveform.h and the matching `const _: () = assert!(...)` on the Rust
  # side trip together if layouts drift.
  # ----------------------------------------------------------------------
  firmware:
    name: firmware (SAM3X)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build firmware
        run: |
          cd ATSAM3X8E_FW/ATSAM3X8E_FW
          make

      - name: Install Rust toolchain (for wire-format guard)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config

      - name: Verify wire-struct sizes match between C and Rust
        working-directory: physerver
        run: cargo build --release -p phycmd-core

      - name: Archive firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: phycmd_fw
          path: |
            ATSAM3X8E_FW/ATSAM3X8E_FW/build/phycmd_fw.bin
            ATSAM3X8E_FW/ATSAM3X8E_FW/build/phycmd_fw.elf
            ATSAM3X8E_FW/ATSAM3X8E_FW/build/phycmd_fw.hex

  # ----------------------------------------------------------------------
  # Python bindings smoke test — installs the pyo3 extension and runs the
  # mock-transport smoke test. The hardware-bound test (`test_waveform.py`)
  # exits 77 when no Due is attached; CI has no USB device so we skip it.
  # ----------------------------------------------------------------------
  python-bindings:
    name: python (maturin + smoke)
    runs-on: ubuntu-latest
    needs: physerver
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config \
                                  python3-dev python3-venv

      - name: Build + install pyo3 extension
        working-directory: physerver/crates/phycmd-py
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip maturin
          .venv/bin/maturin develop --release

      - name: Run mock-transport smoke test
        working-directory: physerver/crates/phycmd-py
        run: .venv/bin/python tests/test_smoke.py

  # ----------------------------------------------------------------------
  # Docs build — rustdoc for the public crates; link-check the top-level
  # README files so a broken `[text](path)` trips CI instead of 404-ing
  # on GitHub.
  # ----------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    needs: physerver
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config

      - name: rustdoc
        working-directory: physerver
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: yes
          config-file: .github/mlc_config.json
        continue-on-error: true
