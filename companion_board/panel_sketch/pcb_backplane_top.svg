      </g>
      <text x="33.5" y="43" class="label-ref">J7</text>
      <text x="33.5" y="45" class="label-pers">DB9-2 Quick Digital</text>
    </g>
    <g id="J8">
      <rect x="44" y="37" width="17" height="10" rx="0.5" ry="0.5" class="conn-body-dsub9"/>
      <g class="pad" transform="translate(46.77, 39.73)">
        <circle cx="0"     cy="0" r="0.4"/><circle cx="0"     cy="2.54" r="0.4"/>
        <circle cx="2.54"  cy="0" r="0.4"/><circle cx="2.54"  cy="2.54" r="0.4"/>
        <circle cx="5.08"  cy="0" r="0.4"/><circle cx="5.08"  cy="2.54" r="0.4"/>
        <circle cx="7.62"  cy="0" r="0.4"/><circle cx="7.62"  cy="2.54" r="0.4"/>
        <circle cx="10.16" cy="0" r="0.4"/><circle cx="10.16" cy="2.54" r="0.4"/>
      </g>
      <text x="52.5" y="43" class="label-ref">J8</text>
      <text x="52.5" y="45" class="label-pers">DB9-3 Quick COMM</text>
    </g>
    <g id="J9">
      <rect x="63" y="37" width="17" height="10" rx="0.5" ry="0.5" class="conn-body-dsub9"/>
      <g class="pad" transform="translate(65.77, 39.73)">
        <circle cx="0"     cy="0" r="0.4"/><circle cx="0"     cy="2.54" r="0.4"/>
        <circle cx="2.54"  cy="0" r="0.4"/><circle cx="2.54"  cy="2.54" r="0.4"/>
        <circle cx="5.08"  cy="0" r="0.4"/><circle cx="5.08"  cy="2.54" r="0.4"/>
        <circle cx="7.62"  cy="0" r="0.4"/><circle cx="7.62"  cy="2.54" r="0.4"/>
        <circle cx="10.16" cy="0" r="0.4"/><circle cx="10.16" cy="2.54" r="0.4"/>
      </g>
      <text x="71.5" y="43" class="label-ref">J9</text>
      <text x="71.5" y="45" class="label-pers">DB9 CAN (rear)</text>
    </g>
    <g id="J10">
      <rect x="82" y="37" width="17" height="10" rx="0.5" ry="0.5" class="conn-body-dsub9"/>
      <g class="pad" transform="translate(84.77, 39.73)">
        <circle cx="0"     cy="0" r="0.4"/><circle cx="0"     cy="2.54" r="0.4"/>
