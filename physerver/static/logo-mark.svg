<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"
     stroke="#667eea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <title>PhyCommander mark — Φ with outbound arrow</title>
  <!-- Φ: circle + vertical bar -->
  <circle cx="24" cy="32" r="15"/>
  <line x1="24" y1="12" x2="24" y2="52"/>
  <!-- '>' signal arrow on the right edge, small enough to read as part
       of the monogram at 16 px without becoming noise. -->
  <polyline points="44,24 54,32 44,40"/>
</svg>
