  <!-- ============================================================ -->
  <!-- J12 + R2: panel button + LED header (1x4) -->
  <!-- Doc (8, 40) -> SVG (8, 60).  R2 doc (8, 44) -> SVG (8, 56).   -->
  <!-- Body 10.16 x 2.54mm horizontal, 4 pins at 2.54mm pitch.       -->
  <!-- ============================================================ -->
  <g id="J12-R2-panel-button-LED">
    <!-- R2 220 ohm THT axial horizontal -->
    <g class="passive">
      <rect x="4.85" y="54.75" width="6.3" height="2.5"/>
    </g>
    <text x="8" y="59.6" class="label-coord">R2 220R</text>

    <!-- J12 body -->
    <rect x="2.92" y="58.73" width="10.16" height="2.54" rx="0.3" ry="0.3" class="conn-body-jtag"/>
    <!-- 4 pins at x = 4.19, 6.73, 9.27, 11.81 (centered at x=8, pitch 2.54) -->
    <g class="pad">
      <circle cx="4.19"  cy="60" r="0.5"/>
      <circle cx="6.73"  cy="60" r="0.5"/>
      <circle cx="9.27"  cy="60" r="0.5"/>
      <circle cx="11.81" cy="60" r="0.5"/>
    </g>
    <text x="8" y="63.2" class="label-ref">J12</text>
    <text x="8" y="65.2" class="label-pers">Panel button + LED</text>
    <text x="4.19"  y="67.5" class="label-pin">1</text>
    <text x="6.73"  y="67.5" class="label-pin">2</text>
    <text x="9.27"  y="67.5" class="label-pin">3</text>
    <text x="11.81" y="67.5" class="label-pin">4</text>
    <text x="8" y="69.5" class="label-coord">LED+ LED- RST GND</text>
  </g>

  <!-- R3 10kΩ nTRST pull-up (just above CAN frame, between J11 and CAN xceiver) -->
  <!-- KiCad/SVG (108, 49), THT axial horizontal, body 6.3 x 2.5 mm -->
  <g id="R3-nTRST-pullup">
    <g class="passive">
      <rect x="104.85" y="47.75" width="6.3" height="2.5"/>
    </g>
    <text x="108" y="46" class="label-coord">R3 10k (nTRST PU)</text>
  </g>

  <!-- CAN transceiver subcircuit (east margin) -->
  <g id="can-subcircuit">
    <rect x="102.5" y="51" width="15" height="44" rx="0.6" ry="0.6" class="silk"/>
    <text x="110" y="53.5" class="label-area">CAN xceiver</text>

    <!-- C3, C4 (100nF decoupling, top) -->
    <g class="passive">
      <rect x="103" y="56.5" width="2" height="3"/>
      <rect x="113" y="56.5" width="2" height="3"/>
    </g>
    <text x="104" y="62" class="label-coord">C3</text>
    <text x="114" y="62" class="label-coord">C4</text>

    <!-- U1 MCP2562FD DIP-8 -->
    <rect x="105" y="61.5" width="10" height="7" rx="0.3" ry="0.3" class="ic-body"/>
    <g class="pad">
      <circle cx="106" cy="62.5" r="0.3"/><circle cx="106" cy="64.5" r="0.3"/>
      <circle cx="106" cy="66.5" r="0.3"/><circle cx="106" cy="68.5" r="0.3"/>
      <circle cx="114" cy="62.5" r="0.3"/><circle cx="114" cy="64.5" r="0.3"/>
      <circle cx="114" cy="66.5" r="0.3"/><circle cx="114" cy="68.5" r="0.3"/>
    </g>
    <text x="110" y="65.5" class="label-ref">U1</text>
    <text x="110" y="71" class="label-coord">MCP2562FD</text>

    <!-- C1, C2 (10uF bulk) -->
    <g class="passive">
      <rect x="103" y="70.5" width="2" height="3"/>
      <rect x="113" y="70.5" width="2" height="3"/>
    </g>
    <text x="104" y="76" class="label-coord">C1</text>
    <text x="114" y="76" class="label-coord">C2</text>

    <!-- R1 120 ohm -->
    <g class="passive">
      <rect x="107" y="76" width="6" height="2"/>
    </g>
    <text x="110" y="80" class="label-coord">R1 120R</text>

    <!-- SW1 DPST term enable -->
    <rect x="106.5" y="83.5" width="7" height="5" rx="0.3" ry="0.3" class="switch"/>
    <text x="110" y="86.5" class="label-coord">SW1 term</text>
    <text x="110" y="91" class="label-coord">on/off</text>
  </g>

  <!-- Footer notes (silkscreen) -->
  <g id="legend" transform="translate(2, 96)">
    <text x="0" y="0" class="label-coord" style="text-anchor:start; opacity:0.6">Origin (0,0) at SW corner. SVG Y-axis flipped vs design doc (doc y up, SVG y down). All dims in mm. Print at 100% for 1:1 transfer.</text>
  </g>

</svg>
