<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1400"
     height="680"
     viewBox="0 0 1400 680"
     version="1.1">

  <title>Rear Panel Layout — Phycommander</title>
  <desc>
    Rear panel (viewed from outside): IEC C14 power inlet, main switch, 80mm
    fan grille, and 4 DB9 connectors — COM1, COM2 (motherboard RS-232 serials),
    DEBUG (SWD/JTAG for Arduino Due), and CAN (CAN bus via MCP2562FD).
  </desc>

  <defs>
    <style type="text/css"><![CDATA[
      .panel-fill  { fill: #ececec; stroke: #1a1a1a; stroke-width: 3; }
      .panel-edge  { fill: none; stroke: #1a1a1a; stroke-width: 3; }

      .db9m  { fill: #2d2d2d; stroke: #000; stroke-width: 1.5; }
      .db9f  { fill: #4a4a4a; stroke: #000; stroke-width: 1.5; }
      .iec   { fill: #d0d0d0; stroke: #1a1a1a; stroke-width: 2; }
      .sw    { fill: #a83232; stroke: #501818; stroke-width: 2; }
      .fan   { fill: none; stroke: #1a1a1a; stroke-width: 2; }

      .conn-com   { fill: #f4d65a; }
      .conn-debug { fill: #5b8def; }
      .conn-can   { fill: #d64545; }

      .label-title { font: bold 28px sans-serif; fill: #1a1a1a; }
      .label-sub   { font: 14px sans-serif; fill: #444; }
      .label-group { font: bold 14px sans-serif; fill: #1a1a1a; }
      .label-conn  { font: bold 16px sans-serif; fill: #1a1a1a; }
      .label-func  { font: 11px sans-serif; fill: #1a1a1a; }
      .label-pin   { font: 9px monospace; fill: #e0e0e0; }
      .label-dim   { font: 11px sans-serif; fill: #444; }

      .pin-circle { fill: #888; stroke: #333; stroke-width: 0.5; }
      .pin-hole   { fill: #1a1a1a; stroke: #333; stroke-width: 0.5; }

      .gender-f { fill: #3498db; }
      .gender-m { fill: #e67e22; }
    ]]></style>
  </defs>

  <rect width="1400" height="680" fill="#fafafa"/>

  <!-- =========================================================== -->
  <!-- Title -->
  <!-- =========================================================== -->
  <g transform="translate(60, 40)">
    <text class="label-title">phycommander — Rear Panel</text>
    <text x="0" y="26" class="label-sub">View from outside (user-facing) — all connectors drawn to relative scale, not to absolute scale</text>
  </g>

  <!-- =========================================================== -->
  <!-- Panel outline -->
  <!-- Panel is 1200x400 user units. Assume ~300mm x 100mm for a 19" 2U-ish chassis rear. -->
  <!-- =========================================================== -->
  <g id="panel" transform="translate(80, 120)">
    <rect x="0" y="0" width="1240" height="420" rx="8" ry="8" class="panel-fill"/>

    <!-- Corner mounting holes -->
    <circle cx="18" cy="18" r="6" class="pin-hole"/>
    <circle cx="1222" cy="18" r="6" class="pin-hole"/>
    <circle cx="18" cy="402" r="6" class="pin-hole"/>
    <circle cx="1222" cy="402" r="6" class="pin-hole"/>

    <!-- ============================================================ -->
    <!-- LEFT GROUP: IEC C14 inlet + main switch -->
    <!-- ============================================================ -->
    <g id="power-group" transform="translate(60, 70)">
      <text x="0" y="-20" class="label-group">POWER</text>

      <!-- IEC C14 inlet -->
      <g id="iec-c14">
        <rect x="0" y="0" width="120" height="90" class="iec"/>
        <!-- C14 pin holes -->
        <rect x="30" y="20" width="14" height="6" class="pin-hole"/>
        <rect x="76" y="20" width="14" height="6" class="pin-hole"/>
        <circle cx="60" cy="62" r="6" class="pin-hole"/>
        <text x="60" y="115" text-anchor="middle" class="label-conn">IEC C14</text>
        <text x="60" y="132" text-anchor="middle" class="label-func">90-264 VAC mains in</text>
      </g>

      <!-- Fuse holder -->
      <g transform="translate(150, 10)">
        <rect x="0" y="0" width="40" height="70" class="iec"/>
        <circle cx="20" cy="35" r="14" class="pin-hole"/>
        <text x="20" y="95" text-anchor="middle" class="label-conn">FUSE</text>
        <text x="20" y="112" text-anchor="middle" class="label-func">5x20 T3.15A</text>
      </g>

      <!-- Main switch (rocker) -->
      <g transform="translate(230, 10)">
        <rect x="0" y="0" width="60" height="70" class="sw"/>
        <rect x="10" y="20" width="40" height="30" fill="#701010"/>
        <text x="30" y="42" text-anchor="middle" class="label-pin" style="font-size:18px; fill:#fff">I/O</text>
        <text x="30" y="95" text-anchor="middle" class="label-conn">MAIN SW</text>
        <text x="30" y="112" text-anchor="middle" class="label-func">master on/off</text>
      </g>
    </g>

    <!-- ============================================================ -->
    <!-- CENTER GROUP: 4 DB9 connectors -->
    <!-- ============================================================ -->
    <g id="dsub-group" transform="translate(430, 60)">
      <text x="0" y="-10" class="label-group">SERIAL / DEBUG / CAN</text>

      <!-- COM1 - DB9 male, RS-232 -->
      <g id="com1" transform="translate(0, 30)">
        <rect x="0" y="0" width="140" height="70" class="conn-com"/>
        <!-- DB9 outline (trapezoid) -->
        <path d="M 20,15 L 120,15 L 125,55 L 15,55 Z" class="db9m"/>
        <!-- Pin marks - 5 top, 4 bottom -->
        <g fill="#d4a04a">
          <circle cx="30" cy="25" r="3"/><circle cx="50" cy="25" r="3"/><circle cx="70" cy="25" r="3"/>
          <circle cx="90" cy="25" r="3"/><circle cx="110" cy="25" r="3"/>
          <circle cx="40" cy="45" r="3"/><circle cx="60" cy="45" r="3"/><circle cx="80" cy="45" r="3"/>
          <circle cx="100" cy="45" r="3"/>
        </g>
        <text x="70" y="90" text-anchor="middle" class="label-conn">COM1</text>
        <text x="70" y="107" text-anchor="middle" class="label-func">RS-232 · DB9 male</text>
        <text x="70" y="121" text-anchor="middle" class="label-func">motherboard UART1</text>
        <text x="70" y="135" text-anchor="middle" class="label-func" style="fill:#888">/dev/ttyS0</text>
      </g>

      <!-- COM2 - DB9 male, RS-232 -->
      <g id="com2" transform="translate(160, 30)">
        <rect x="0" y="0" width="140" height="70" class="conn-com"/>
        <path d="M 20,15 L 120,15 L 125,55 L 15,55 Z" class="db9m"/>
        <g fill="#d4a04a">
          <circle cx="30" cy="25" r="3"/><circle cx="50" cy="25" r="3"/><circle cx="70" cy="25" r="3"/>
          <circle cx="90" cy="25" r="3"/><circle cx="110" cy="25" r="3"/>
          <circle cx="40" cy="45" r="3"/><circle cx="60" cy="45" r="3"/><circle cx="80" cy="45" r="3"/>
          <circle cx="100" cy="45" r="3"/>
        </g>
        <text x="70" y="90" text-anchor="middle" class="label-conn">COM2</text>
        <text x="70" y="107" text-anchor="middle" class="label-func">RS-232 · DB9 male</text>
        <text x="70" y="121" text-anchor="middle" class="label-func">motherboard UART2</text>
        <text x="70" y="135" text-anchor="middle" class="label-func" style="fill:#888">/dev/ttyS1</text>
      </g>

      <!-- DEBUG - DB9 female, SWD/JTAG -->
      <g id="debug" transform="translate(340, 30)">
        <rect x="0" y="0" width="140" height="70" class="conn-debug"/>
        <path d="M 15,15 L 125,15 L 120,55 L 20,55 Z" class="db9f"/>
        <g fill="#333">
          <circle cx="30" cy="25" r="3.5" class="pin-hole"/><circle cx="50" cy="25" r="3.5" class="pin-hole"/>
          <circle cx="70" cy="25" r="3.5" class="pin-hole"/><circle cx="90" cy="25" r="3.5" class="pin-hole"/>
          <circle cx="110" cy="25" r="3.5" class="pin-hole"/>
          <circle cx="40" cy="45" r="3.5" class="pin-hole"/><circle cx="60" cy="45" r="3.5" class="pin-hole"/>
          <circle cx="80" cy="45" r="3.5" class="pin-hole"/><circle cx="100" cy="45" r="3.5" class="pin-hole"/>
        </g>
        <text x="70" y="90" text-anchor="middle" class="label-conn">DEBUG</text>
        <text x="70" y="107" text-anchor="middle" class="label-func">SWD/JTAG · DB9 female</text>
        <text x="70" y="121" text-anchor="middle" class="label-func">ATSAM3X8E debug</text>
        <text x="70" y="135" text-anchor="middle" class="label-func" style="fill:#888">J-Link, ST-Link, CMSIS-DAP</text>
      </g>

      <!-- CAN - DB9 male -->
      <g id="can" transform="translate(500, 30)">
        <rect x="0" y="0" width="140" height="70" class="conn-can"/>
        <path d="M 20,15 L 120,15 L 125,55 L 15,55 Z" class="db9m"/>
        <g fill="#d4a04a">
          <circle cx="30" cy="25" r="3"/><circle cx="50" cy="25" r="3"/><circle cx="70" cy="25" r="3"/>
          <circle cx="90" cy="25" r="3"/><circle cx="110" cy="25" r="3"/>
          <circle cx="40" cy="45" r="3"/><circle cx="60" cy="45" r="3"/><circle cx="80" cy="45" r="3"/>
          <circle cx="100" cy="45" r="3"/>
        </g>
        <text x="70" y="90" text-anchor="middle" class="label-conn">CAN</text>
        <text x="70" y="107" text-anchor="middle" class="label-func">CAN 2.0 B · DB9 male</text>
        <text x="70" y="121" text-anchor="middle" class="label-func">CiA 303-1 pinout</text>
        <text x="70" y="135" text-anchor="middle" class="label-func" style="fill:#888">via MCP2562FD (internal)</text>
      </g>
    </g>

    <!-- ============================================================ -->
    <!-- RIGHT GROUP: 80mm fan grille -->
    <!-- ============================================================ -->
    <g id="fan-group" transform="translate(1080, 120)">
      <text x="60" y="-25" text-anchor="middle" class="label-group">EXHAUST</text>

      <!-- Fan outer square -->
      <rect x="0" y="0" width="120" height="120" rx="6" ry="6" fill="#d8d8d8" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Grille (concentric circles + radial lines) -->
      <circle cx="60" cy="60" r="54" class="fan"/>
      <circle cx="60" cy="60" r="42" class="fan"/>
      <circle cx="60" cy="60" r="30" class="fan"/>
      <circle cx="60" cy="60" r="18" class="fan"/>
      <circle cx="60" cy="60" r="8" fill="#444"/>
      <g class="fan">
        <line x1="60" y1="6" x2="60" y2="114"/>
        <line x1="6" y1="60" x2="114" y2="60"/>
        <line x1="22" y1="22" x2="98" y2="98"/>
        <line x1="98" y1="22" x2="22" y2="98"/>
      </g>
      <!-- Fan mounting holes -->
      <circle cx="8" cy="8" r="3" class="pin-hole"/>
      <circle cx="112" cy="8" r="3" class="pin-hole"/>
      <circle cx="8" cy="112" r="3" class="pin-hole"/>
      <circle cx="112" cy="112" r="3" class="pin-hole"/>

      <text x="60" y="145" text-anchor="middle" class="label-conn">FAN 80mm</text>
      <text x="60" y="162" text-anchor="middle" class="label-func">12V/DC brushless</text>
    </g>

    <!-- ============================================================ -->
    <!-- Footer text (inside panel) -->
    <!-- ============================================================ -->
    <text x="620" y="395" text-anchor="middle" class="label-func" style="fill:#888; font-style:italic">phycommander v1.0  ·  S/N ________  ·  Made in Italy</text>
  </g>

  <!-- =========================================================== -->
  <!-- Gender legend (bottom) -->
  <!-- =========================================================== -->
  <g transform="translate(80, 575)">
    <text x="0" y="0" class="label-group">Gender convention:</text>

    <circle cx="220" cy="-5" r="10" class="gender-m"/>
    <text x="240" y="0" class="label-sub">orange / trapezoid-up = male  (COM1, COM2, CAN)</text>

    <circle cx="640" cy="-5" r="10" class="gender-f"/>
    <text x="660" y="0" class="label-sub">blue / trapezoid-down = female  (DEBUG)</text>
  </g>

  <!-- Color key -->
  <g transform="translate(80, 610)">
    <text x="0" y="0" class="label-group">Connector class:</text>

    <rect x="220" y="-12" width="20" height="14" class="conn-com"/>
    <text x="248" y="0" class="label-sub">Serial RS-232 (motherboard)</text>

    <rect x="480" y="-12" width="20" height="14" class="conn-debug"/>
    <text x="508" y="0" class="label-sub">Debug SWD/JTAG (Due)</text>

    <rect x="720" y="-12" width="20" height="14" class="conn-can"/>
    <text x="748" y="0" class="label-sub">CAN bus (Due CAN0)</text>
  </g>

  <!-- Footer: reference -->
  <g transform="translate(80, 650)">
    <text x="0" y="0" class="label-sub" style="font-style:italic">See docs/technical/DEVICE_PINOUT.md for full pin-by-pin tables, cable adapters and design rationale.</text>
  </g>

</svg>
