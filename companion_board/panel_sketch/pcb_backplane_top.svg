          <circle cx="5.08"  cy="0" r="0.4"/><circle cx="5.08"  cy="2.54" r="0.4"/>
          <circle cx="7.62"  cy="0" r="0.4"/><circle cx="7.62"  cy="2.54" r="0.4"/>
          <circle cx="10.16" cy="0" r="0.4"/><circle cx="10.16" cy="2.54" r="0.4"/>
          <circle cx="12.7"  cy="0" r="0.4"/><circle cx="12.7"  cy="2.54" r="0.4"/>
          <circle cx="15.24" cy="0" r="0.4"/><circle cx="15.24" cy="2.54" r="0.4"/>
          <circle cx="17.78" cy="0" r="0.4"/><circle cx="17.78" cy="2.54" r="0.4"/>
          <circle cx="20.32" cy="0" r="0.4"/><circle cx="20.32" cy="2.54" r="0.4"/>
          <circle cx="22.86" cy="0" r="0.4"/><circle cx="22.86" cy="2.54" r="0.4"/>
          <circle cx="25.4"  cy="0" r="0.4"/><circle cx="25.4"  cy="2.54" r="0.4"/>
          <circle cx="27.94" cy="0" r="0.4"/><circle cx="27.94" cy="2.54" r="0.4"/>
          <circle cx="30.48" cy="0" r="0.4"/><circle cx="30.48" cy="2.54" r="0.4"/>
        </g>
      </g>
      <text x="26.5" y="13" class="label-ref">J1</text>
      <text x="26.5" y="15" class="label-pers">DB25-1 SENSING</text>
      <text x="26.5" y="20" class="label-coord">16 DIN + 8 ADC + AGND</text>
    </g>
    <g id="J2">
      <rect x="52.5" y="7" width="38" height="10" rx="0.5" ry="0.5" class="conn-body-dsub25"/>
      <g class="pad">
        <g transform="translate(53.27, 9.73)">
