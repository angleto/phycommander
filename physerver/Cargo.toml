[workspace]
members = [
    "crates/phycmd-core",
    "crates/phycmd-rust",
    "crates/phycmd-py",
]
# The `physerver` binary/library also lives at the workspace root —
# it is implicitly a member.
#
# Note: `phycmd-py` is a pyo3 `cdylib` and is normally built via
# `maturin develop` / `maturin build` from its own directory — the
# workspace member entry lets `cargo build --workspace` verify that
# it compiles as an rlib, which catches type errors at the Rust
# level without requiring a Python toolchain.

[package]
name = "physerver"
version = "2.1.0"
edition = "2021"
authors = ["Angelo Leto <angelo@leto.blue>"]
description = "Physical Commander - Real-time hardware control server"
license = "AGPL-3.0-or-later"

[lib]
name = "physerver"
path = "src/lib.rs"

[[bin]]
name = "physerver"
path = "src/main.rs"

[dependencies]
# Core protocol/transport/rt primitives extracted into their own crate.
phycmd-core = { path = "crates/phycmd-core", features = ["usb"] }

# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }

# Serial port communication — still needed directly by the legacy
# serial::SerialPortHandler auto-detect helper in src/transport/serial.rs
# callers. Will go away once the binary stops poking at serialport
# directly and uses phycmd-core::transport abstractions only.
serialport = "4.3"

# Direct USB communication (optional, requires libudev) — same note:
# re-exported via phycmd-core but kept here for any residual direct use.
rusb = { version = "0.9", optional = true }

# Protocol and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Web server
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WebSocket support
tokio-tungstenite = "0.29"

# Shared memory IPC
shared_memory = "0.12"

# Real-time and system
nix = { version = "0.27", features = ["sched", "signal", "mman"] }
libc = "0.2"

# Logging and telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1.19"
bytes = "1.5"
num_cpus = "1.16"

# CRC calculation
crc = "3.0"

# Time
chrono = "0.4"
sd-notify = "0.5.0"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }

[features]
default = ["usb"]
usb = ["rusb"]

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
# Enable MockTransport for benchmarks + integration tests without
# leaking it into the release binary (phycmd-core's regular dep
# above builds with just "usb").
phycmd-core = { path = "crates/phycmd-core", features = ["usb", "test-mock"] }
# Lightweight sync HTTP client for the bench_loopback test suite.
# Default TLS features off: the tests talk to a local http:// URL.
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

# criterion uses its own harness and registers benchmarks via the
# `criterion_main!` macro. Without `harness = false` cargo would
# wrap the file in libtest's runner, which silently reports
# "0 tests" and never actually measures anything.
[[bench]]
name = "protocol_bench"
harness = false

[[bench]]
name = "transport_bench"
harness = false
