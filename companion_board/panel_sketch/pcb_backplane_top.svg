<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="120mm" height="100mm"
     viewBox="0 0 120 100"
     version="1.1">

  <title>PCB Backplane v4 — Top Layer (component side, 1:1 placement guide)</title>
  <desc>
    1:1 scale placement guide for the phycommander I/O backplane v4
    (120 x 100 mm, 4-layer Arduino Due shield). Top side carries:
    10 D-Sub IDC headers (2 DB25 + 3 DB15 + 5 DB9), 1 JTAG bridge
    header (2x5 2.54mm), and the CAN transceiver subcircuit
    (MCP2562FD DIP-8 + 120 ohm termination + DPST switch + decoupling).
    The Arduino Due footprint is shown as a dashed ghost outline.
    JTAG cutout is shown as a clear-fill rounded rectangle.
    Coordinates are in millimetres with origin at the south-west
    corner of the backplane; SVG Y-axis is flipped relative to
    PCB_BACKPLANE_PINOUT.md (doc Y up, SVG Y down). Print at "actual
    size" / "100% scale" for a 1:1 transfer onto a real PCB.
  </desc>

  <defs>
    <style type="text/css"><![CDATA[
      .pcb-bg     { fill: #2a5a3a; }
      .silk       { fill: none; stroke: #f5f5f5; stroke-width: 0.15; }
      .silk-fill  { fill: #f5f5f5; stroke: none; }
      .ghost      { fill: none; stroke: #ffffff; stroke-width: 0.25; stroke-dasharray: 1.5,0.7; opacity: 0.45; }
      .cutout     { fill: #fafafa; stroke: #1a1a1a; stroke-width: 0.20; }
      .hole       { fill: #1a1a1a; stroke: #d0d0d0; stroke-width: 0.10; }
      .pad        { fill: #c8a14a; stroke: none; }
      .conn-body-dsub25 { fill: #1f1f1f; stroke: #f5f5f5; stroke-width: 0.20; }
      .conn-body-dsub15 { fill: #1f1f1f; stroke: #f5f5f5; stroke-width: 0.20; }
      .conn-body-dsub9  { fill: #1f1f1f; stroke: #f5f5f5; stroke-width: 0.20; }
      .conn-body-jtag   { fill: #2a3a6a; stroke: #f5f5f5; stroke-width: 0.20; }
      .ic-body          { fill: #1a1a1a; stroke: #f5f5f5; stroke-width: 0.20; }
      .passive          { fill: #4a4a4a; stroke: #f5f5f5; stroke-width: 0.15; }
      .switch           { fill: #6a4a3a; stroke: #f5f5f5; stroke-width: 0.20; }
      .label-ref  { font: bold 1.6px sans-serif; fill: #ffffff; text-anchor: middle; }
      .label-pers { font: 1.3px sans-serif; fill: #ffffff; text-anchor: middle; }
      .label-coord{ font: 1.2px sans-serif; fill: #ffffff; opacity: 0.65; text-anchor: middle; }
      .label-area { font: italic 1.4px sans-serif; fill: #ffffff; text-anchor: middle; opacity: 0.7; }
      .label-title{ font: bold 2.4px sans-serif; fill: #ffffff; text-anchor: start; }
      .label-sub  { font: 1.4px sans-serif; fill: #ffffff; text-anchor: start; opacity: 0.85; }
      .label-pin  { font: 0.9px monospace; fill: #ffffff; text-anchor: middle; opacity: 0.75; }
    ]]></style>
  </defs>

  <!-- PCB substrate (board outline) -->
  <rect x="0" y="0" width="120" height="100" rx="0.8" ry="0.8" class="pcb-bg"/>

  <!-- Title block (silkscreen, top-left corner) -->
  <g transform="translate(2, 3)">
    <text class="label-title">phycommander backplane v4</text>
    <text x="0" y="2.8" class="label-sub">120 x 100 mm  ·  4-layer  ·  Arduino Due shield  ·  TOP layer</text>
  </g>

  <!-- Arduino Due footprint (ghost outline) -->
  <!-- Doc: x=0..101.6, y=0..53.34 (flush SW)  ->  SVG: x=0..101.6, y=46.66..100 -->
  <g id="due-ghost">
    <rect x="0" y="46.66" width="101.6" height="53.34" class="ghost"/>
    <text x="50.8" y="74" class="label-area">Arduino Due R3 footprint (under shield)</text>
    <text x="50.8" y="77" class="label-area">USB-B + DC jack on the west edge below</text>
  </g>

  <!-- Mounting holes (4 Due-native + 4 backplane corners) -->
  <g id="mounting-holes">
    <circle cx="15.24" cy="49.20" r="1.6" class="hole"/>
    <circle cx="90.17" cy="49.20" r="1.6" class="hole"/>
    <circle cx="66.04" cy="82.22" r="1.6" class="hole"/>
    <circle cx="15.24" cy="97.46" r="1.6" class="hole"/>
    <circle cx="4"     cy="96"    r="1.6" class="hole"/>
    <circle cx="116"   cy="96"    r="1.6" class="hole"/>
    <circle cx="4"     cy="4"     r="1.6" class="hole"/>
    <circle cx="116"   cy="4"     r="1.6" class="hole"/>
    <text x="15.24" y="51.8" class="label-coord">MH1</text>
    <text x="90.17" y="51.8" class="label-coord">MH2</text>
    <text x="66.04" y="84.8" class="label-coord">MH3</text>
    <text x="15.24" y="100"  class="label-coord">MH4</text>
    <text x="4"     y="93"   class="label-coord">MH5</text>
    <text x="116"   y="93"   class="label-coord">MH6</text>
    <text x="4"     y="7"    class="label-coord">MH7</text>
    <text x="116"   y="7"    class="label-coord">MH8</text>
  </g>

  <!-- JTAG cutout (~14 x 7 mm, centered at doc (16, 26) -> SVG (16, 74)) -->
  <g id="jtag-cutout">
    <rect x="9" y="70.5" width="14" height="7" rx="1" ry="1" class="cutout"/>
    <text x="16" y="74" class="label-coord" style="fill:#1a1a1a; opacity:0.85">JTAG cutout</text>
    <text x="16" y="76" class="label-coord" style="fill:#1a1a1a; opacity:0.7">14 x 7 mm</text>
  </g>

