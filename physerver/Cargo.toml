[package]
name = "physerver"
version = "1.0.0"
edition = "2021"
authors = ["PhyCMD Contributors"]
description = "Physical Commander - Real-time hardware control server"
license = "MIT"

[lib]
name = "physerver"
path = "src/lib.rs"

[[bin]]
name = "physerver"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }

# Serial port communication
serialport = "4.3"

# Direct USB communication (optional, requires libudev)
rusb = { version = "0.9", optional = true }

# Protocol and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Web server
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WebSocket support
tokio-tungstenite = "0.21"

# Shared memory IPC
shared_memory = "0.12"

# Real-time and system
nix = { version = "0.27", features = ["sched", "signal", "mman"] }
libc = "0.2"

# Logging and telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1.19"
bytes = "1.5"

# CRC calculation
crc = "3.0"

# Time
chrono = "0.4"

[features]
default = ["usb"]
usb = ["rusb"]

[dev-dependencies]
criterion = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
